name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建 packages
        run: pnpm build:packages

      - name: 构建 UI
        run: pnpm --filter @bilihub/ui build

      - name: 校验主进程 require/export 一致
        run: node tools/verify-requires.mjs

      - name: 校验设计令牌与模块注册表未漂移
        run: |
          pip install --quiet pillow
          python tools/extract-tokens.py
          node tools/gen-tokens.mjs
          node tools/gen-registry.mjs
          git diff --exit-code registry/modules.json packages/ui/src/tokens.css packages/ui/src/tokens.js
