name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建 packages 与 UI
        run: pnpm build:packages && pnpm --filter @bilihub/ui build

      # 顺序不可颠倒：先 electron-builder（含代码签名），再 EVS VMP 签名
      - name: 打包（含代码签名）
        if: env.CSC_LINK != ''
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --win --publish never

      - name: 打包（无代码签名证书时的降级路径）
        if: env.CSC_LINK == ''
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --win --publish never

      - name: 安装 castlabs-evs
        run: |
          pip install castlabs-evs
          python -m castlabs_evs.account signup --overwrite 2>$null
        env:
          EVS_ACCOUNT: ${{ secrets.EVS_ACCOUNT }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        continue-on-error: true

      - name: EVS VMP 签名（必须在打包之后）
        run: node scripts/sign-vmp.mjs
        continue-on-error: true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BiliHub-windows
          path: release/**
          if-no-files-found: warn

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.yml
          draft: true
